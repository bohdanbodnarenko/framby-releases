# Framby releases — publish the Sparkle appcast on GitHub Pages (docs/12 §9 in the private
# source repository).
#
# This workflow lives in the PUBLIC repository bohdanbodnarenko/framby-releases, which holds
# only appcast.xml, this landing page and the DMGs (as GitHub Releases assets). The source
# is private, and Sparkle cannot download from a private repository's releases.
#
# The feed installed copies read, https://framby.app/appcast.xml, is this repository's
# appcast.xml as it is on main.
#
# Releasing: the source repository's release workflow uploads the notarized DMG to a DRAFT
# release here and parks its feed entry on the branch pending-appcast/<tag> (one file,
# item.xml). Publishing that draft is the one human step. It starts this workflow, which
# checks the release's DMG is downloadable, moves the item into appcast.xml on main, deletes
# the branch and deploys — so the feed never names a DMG that is not public. Both happen in
# this one workflow because a push made with GITHUB_TOKEN starts no other workflow.
#
# The site is the appcast and one static page: no scripts, no assets from elsewhere, no
# analytics.

name: Pages

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - appcast.xml
      - index.html
      - .github/workflows/pages.yml
  workflow_dispatch:

# One run at a time, and never cancel one halfway: two releases published together are
# added one after the other.
concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

jobs:
  feed:
    name: Add the published release to the appcast
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
      RELEASE_NAME: ${{ github.event.release.name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Fetch the pending entry
        id: pending
        run: |
          branch="pending-appcast/$TAG"
          if ! git fetch --depth 1 origin "refs/heads/$branch:refs/remotes/origin/$branch"; then
            echo "::warning::no $branch: a release made by hand, so the appcast is left as it is"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git show "origin/$branch:item.xml" > "$RUNNER_TEMP/item.xml"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Check the entry and its download
        if: steps.pending.outputs.found == 'true'
        run: |
          python3 - "$RUNNER_TEMP/item.xml" "$TAG" <<'PY'
          import sys, xml.etree.ElementTree as t
          text, tag = open(sys.argv[1]).read(), sys.argv[2]
          sparkle = "http://www.andymatuschak.org/xml-namespaces/sparkle"
          item = t.fromstring(text.replace("<item>", f'<item xmlns:sparkle="{sparkle}">', 1))
          enclosure = item.find("enclosure")
          url = enclosure.get("url")
          assert f"/releases/download/{tag}/" in url, f"the entry names {url}, not a {tag} asset"
          assert enclosure.get(f"{{{sparkle}}}edSignature"), "the entry is not signed"
          open(sys.argv[1] + ".url", "w").write(url)
          PY
          url=$(cat "$RUNNER_TEMP/item.xml.url")
          size=$(curl -fsSIL --max-time 60 "$url" | awk 'tolower($1)=="content-length:" {n=$2} END {print n+0}')
          length=$(sed -n 's/.*length="\([0-9]*\)".*/\1/p' "$RUNNER_TEMP/item.xml")
          [ "$size" = "$length" ] || { echo "::error::$url answers $size bytes, the entry says $length"; exit 1; }
          echo "download checked: $url ($size bytes)"

      - name: Add it to appcast.xml on main
        if: steps.pending.outputs.found == 'true'
        run: |
          python3 - appcast.xml "$RUNNER_TEMP/item.xml" <<'PY'
          import re, sys, xml.etree.ElementTree as t
          path, item = sys.argv[1], open(sys.argv[2]).read()
          feed = open(path).read()
          build = re.search(r"<sparkle:version>(\d+)</sparkle:version>", item).group(1)
          if f"<sparkle:version>{build}</sparkle:version>" in feed:
              print(f"build {build} is already in the feed"); sys.exit(0)
          # Newest first, above the items already there.
          at = feed.find("    <item>")
          at = at if at != -1 else feed.index("  </channel>")
          open(path, "w").write(feed[:at] + item + feed[at:])
          t.parse(path)
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "Feed: $RELEASE_NAME ($TAG)"
            git push origin HEAD:main
          fi
          git push origin --delete "pending-appcast/$TAG"

  deploy:
    name: Deploy the appcast
    needs: feed
    # After the feed job on a release; on its own for a push or by hand.
    if: always() && (needs.feed.result == 'success' || needs.feed.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # main, not the event's ref: on a release that is the tag, which predates the feed commit.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Check the appcast is well-formed XML
        run: python3 -c 'import sys, xml.etree.ElementTree as tree; tree.parse(sys.argv[1])' appcast.xml

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp appcast.xml index.html _site/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
